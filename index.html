<title>Musée Madame Maman</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Hanken+Grotesk:wght@400;500;600;800&display=swap">
<style>
/* Layout : un canvas WebGL fixe en fond ; le défilement d'un espaceur (#parcours) pilote la caméra ; les textes (calques) se superposent en fondu et en parallaxe ; la lettre suit en flux normal. */
:root {
  color-scheme: dark;
  --nuit: #07080d;
  --or: #c7a25a;
  --or-clair: #ecd49b;
  --or-fonce: #8a6a2e;
  --ivoire: #f2ebdc;
  --encre: #2b241d;
  --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --texte: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --gx: max(16px, env(safe-area-inset-left, 0px));
  --gy: max(16px, env(safe-area-inset-right, 0px));
}
* { box-sizing: border-box; }
html { background: var(--nuit); overscroll-behavior-y: none; }
body {
  margin: 0; background: var(--nuit); color: var(--ivoire);
  font: 400 16px/1.55 var(--texte);
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
}
html.lenis, html.lenis body { height: auto; }
.lenis.lenis-smooth { scroll-behavior: auto !important; }
.lenis.lenis-stopped { overflow: hidden; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--or-clair); outline-offset: 3px; }

#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; touch-action: pan-y; }
#parcours { position: relative; z-index: 1; }
/* nuit de fête : la scène 3D passe par-dessus la lettre, sous les rideaux */
body.nuit { overflow: hidden; }
body.nuit #gl { z-index: 7; }
body.nuit #s-cinema { z-index: auto; }
body.nuit .rideaux { z-index: 9; }
body.nuit #suivant { display: none; }
#decompte { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; pointer-events: none; font-family: var(--display); font-weight: 500; font-size: clamp(110px, 34vw, 220px); color: var(--or-clair); text-shadow: 0 0 40px rgba(255, 196, 92, .55), 0 4px 24px rgba(0, 0, 0, .6); }
#decompte span { animation: compte 1s ease-out both; }
@keyframes compte { 0% { opacity: 0; transform: scale(1.6); } 25% { opacity: 1; transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: scale(.85); } }
#s-cinema.entracte .cine-fin { visibility: hidden; }
#feux { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 7; pointer-events: none; }
.scrim{ position: fixed; left: 0; right: 0; z-index: 4; pointer-events: none; }
.scrim.haut { top: 0; height: 34vh; background: linear-gradient(rgba(14, 11, 8, .74), rgba(14, 11, 8, 0)); }
.scrim.bas { bottom: 0; height: 46vh; background: linear-gradient(rgba(14, 11, 8, 0), rgba(14, 11, 8, .86)); }

#calques { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
.calque {
  position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; text-align: center;
  padding: calc(env(safe-area-inset-top, 0px) + 30px) var(--gy) calc(env(safe-area-inset-bottom, 0px) + 92px) var(--gx);
  opacity: 0; visibility: hidden; text-shadow: 0 2px 18px rgba(0, 0, 0, .55);
}
.calque.hb { justify-content: space-between; }
.calque.ht { justify-content: flex-start; }
.expo { font-family: var(--display); font-style: italic; font-size: clamp(20px, 5.6vw, 26px); color: var(--ivoire); margin: 0; }
.verset { font-family: var(--display); font-style: italic; font-size: clamp(18px, 5vw, 22px); line-height: 1.4; color: var(--or-clair); margin: 0; text-wrap: balance; }
.verset .ref { display: block; margin-top: 8px; font-style: normal; font-size: 11px; letter-spacing: .25em; text-transform: uppercase; opacity: .85; }
.calque.on button { pointer-events: auto; }
.calque.on .apres:not(.actif) button { pointer-events: none; }
.bloc { display: grid; gap: 12px; justify-items: center; max-width: 36ch; will-change: transform; }
.calque .bloc {
  width: min(560px, 100%); max-width: none; gap: 8px; padding: 14px 22px 15px; border-radius: 14px; color: var(--encre); text-shadow: none;
  background: linear-gradient(165deg, rgba(255, 254, 250, .96), rgba(249, 242, 228, .94)); border: 1px solid rgba(199, 162, 90, .75);
  box-shadow: inset 0 0 0 5px rgba(255, 253, 247, .9), inset 0 0 0 6px rgba(199, 162, 90, .45), 0 18px 44px rgba(20, 14, 8, .3);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); position: relative;
}
.calque .bloc::before {
  content: ""; position: absolute; top: -1px; left: 50%; width: 56px; height: 2px; transform: translateX(-50%);
  background: linear-gradient(90deg, transparent, var(--or), transparent);
}
.calque .bloc .sur, .calque .bloc .verset, .calque .bloc .annonce, .calque .bloc .pagne-r { color: var(--or-fonce); }
.calque .bloc .titre-musee, .calque .bloc .expo, .calque .bloc .pagne-q, .calque .bloc .pagne-env, .calque .bloc .grand { color: var(--encre); text-shadow: none; }
.calque .bloc .dates { color: #6f5d48; }
.calque .bloc.apres { padding: 16px 12px; }
.calque .bloc.apres .pagne { min-width: 86px; flex: 1; }
.calque .bloc .cartel { box-shadow: 0 0 0 1px rgba(156, 122, 60, .3); width: 100%; }
.calque .bloc .grand { font-size: clamp(28px, 7.8vw, 44px); }
.calque .bloc .verset { font-size: clamp(16px, 4.4vw, 20px); line-height: 1.35; }
.calque .bloc .annonce, .calque .bloc .verset { max-width: 34ch; }
.calque .bloc .texte { font-size: 15px; line-height: 1.5; }
.sur { font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--or-clair); font-weight: 500; }
.titre-musee { font-family: var(--display); font-weight: 500; font-size: clamp(34px, 9.6vw, 60px); line-height: 1.04; margin: 0; color: var(--ivoire); }
.titre-musee .mot { display: inline-block; overflow: hidden; padding: 0 .02em .1em; white-space: nowrap; }
.titre-musee .l { display: inline-block; }
.dates { font-size: 13px; letter-spacing: .3em; color: #cbbb9c; font-variant-numeric: tabular-nums; padding-left: .3em; }
.annonce { font-family: var(--display); font-style: italic; font-size: clamp(19px, 5.2vw, 24px); line-height: 1.35; max-width: 22ch; text-wrap: balance; color: var(--or-clair); margin: 0; }
.indice { font-size: 13px; opacity: .72; }
.pulse { animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.calque .bloc .grand.suspense { font-size: clamp(24px, 6.4vw, 36px); line-height: 1.12; margin: 6px 0 10px; }
.pts i { font-style: normal; animation: pts 1.8s ease-in-out infinite; }
.pts i:nth-child(2) { animation-delay: .3s; } .pts i:nth-child(3) { animation-delay: .6s; }
@keyframes pts { 0%, 100% { opacity: .15; } 40%, 60% { opacity: 1; } }
.grand { font-family: var(--display); font-size: clamp(38px, 11vw, 58px); line-height: 1.02; font-weight: 500; margin: 0; text-wrap: balance; }
.calque .texte { margin: 0; font-size: 16px; line-height: 1.6; opacity: .9; }
.titre-salle { font-family: var(--display); font-style: italic; font-size: 22px; }
.final-grille { display: grid; justify-items: center; align-items: end; }
.final-grille > * { grid-area: 1 / 1; }
.calque.on a { pointer-events: auto; }
.calque.on .apres:not(.actif) a { pointer-events: none; }

/* choix du pagne */
.pagne-q { margin: 0; font-family: var(--display); font-style: italic; font-size: 20px; color: var(--ivoire); text-shadow: 0 1px 12px rgba(20, 14, 8, .85), 0 0 2px rgba(20, 14, 8, .6); }
.pagnes { display: flex; gap: 10px; justify-content: center; }
.pagne {
  display: grid; gap: 7px; justify-items: center; min-width: 94px; padding: 10px 10px 9px; border-radius: 10px; text-shadow: none;
  border: 1px solid rgba(156, 122, 60, .45); background: #fff; color: var(--encre);
  font-size: 13px; font-weight: 500; transition: border-color .3s, background .3s, transform .3s;
}
.pagne .nuancier { display: flex; width: 66px; height: 30px; border-radius: 4px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .18); }
.pagne .nuancier i { flex: 1; }
.pagne[aria-pressed="true"] { border-color: var(--or-fonce); background: #f3e6c6; box-shadow: 0 0 0 1px var(--or-fonce); transform: translateY(-3px); }
.pagne-r { margin: 0; min-height: 1.4em; font-size: 14px; color: var(--or-clair); }
.pagne-env { font-size: 13px; color: var(--ivoire); text-decoration: underline; text-underline-offset: 3px; }

.btn {
  border: 1px solid rgba(236, 212, 155, .55); background: rgba(0, 0, 0, .18); border-radius: 999px;
  padding: 12px 22px; letter-spacing: .02em; font-weight: 500; font-size: 15px;
  transition: background .3s, border-color .3s;
}
.btn:hover { background: rgba(236, 212, 155, .12); border-color: var(--or-clair); }
.btn.plein { background: var(--or-clair); color: var(--encre); border-color: var(--or-clair); }

.cartel {
  border: 1px solid rgba(199, 162, 90, .7); text-align: left; width: min(100%, 320px); color: var(--encre); text-shadow: none;
  background: linear-gradient(165deg, #fffefa, #f7efdd); padding: 15px 17px 14px; border-radius: 2px; display: grid; gap: 4px;
  box-shadow: inset 0 0 0 4px #fffdf7, inset 0 0 0 5px rgba(199, 162, 90, .4), 0 12px 28px rgba(0, 0, 0, .4);
}
.cartel .inv { font-size: 11.5px; color: #8a7660; font-variant-numeric: tabular-nums; }
.cartel .t { font-family: var(--display); font-style: italic; font-size: 19px; line-height: 1.2; }
.cartel .m { font-size: 12.5px; color: #5d4f40; }
.cartel .lire { font-size: 11.5px; color: var(--or-fonce); margin-top: 6px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }

#suivant {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); z-index: 7; transform: translateX(-50%);
  width: 52px; height: 52px; border-radius: 50%; border: 1px solid rgba(236, 212, 155, .5); padding: 0;
  background: rgba(7, 8, 13, .35); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  display: grid; place-items: center; transition: opacity .4s, background .3s;
}
#suivant:hover { background: rgba(236, 212, 155, .14); }
#suivant.cache, body.auto #suivant { opacity: 0; pointer-events: none; }

/* visite guidée : cadre doré plein écran, comme les cartes */
#cadre {
  position: fixed; z-index: 7; pointer-events: none; opacity: 0; transition: opacity 1.4s ease;
  inset: calc(env(safe-area-inset-top, 0px) + 10px) calc(env(safe-area-inset-right, 0px) + 10px) calc(env(safe-area-inset-bottom, 0px) + 10px) calc(env(safe-area-inset-left, 0px) + 10px);
  border: 1px solid rgba(199, 162, 90, .8); border-radius: 4px;
  box-shadow: 0 0 0 30px rgba(250, 246, 238, .96), inset 0 0 0 5px rgba(255, 253, 247, .55), inset 0 0 0 6px rgba(199, 162, 90, .5), inset 0 0 24px rgba(20, 14, 8, .18);
}
#cadre::before { content: ""; position: absolute; left: 50%; top: -2px; width: 120px; height: 3px; transform: translateX(-50%); background: linear-gradient(90deg, rgba(199, 162, 90, 0), #c7a25a, rgba(199, 162, 90, 0)); }
body.auto #cadre { opacity: 1; }
#pause {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 30px); z-index: 8; margin: 0; transform: translate(-50%, 8px);
  padding: 9px 16px; border-radius: 999px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .4s, transform .4s;
  font-size: 12.5px; letter-spacing: .04em; color: var(--encre); background: rgba(255, 253, 247, .94); border: 1px solid rgba(199, 162, 90, .7);
  box-shadow: 0 8px 20px rgba(20, 14, 8, .25);
}
body.auto.pause #pause { opacity: 1; transform: translate(-50%, 0); }
.visite-auto {
  pointer-events: auto; display: block; margin: 14px auto 10px; padding: 13px 24px; border-radius: 999px; cursor: pointer;
  font: 600 13px var(--sans, inherit); letter-spacing: .12em; text-transform: uppercase; color: #fffdf7;
  background: linear-gradient(180deg, #c7a25a, var(--or-fonce)); border: 1px solid var(--or-fonce); box-shadow: 0 8px 20px rgba(138, 106, 46, .3);
}
body.auto .visite-auto, body.auto .calque.hb .indice { visibility: hidden; }

/* fiche (cartel développé) */
.fiche-fond { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); opacity: 0; pointer-events: none; transition: opacity .35s; z-index: 30; }
.fiche-fond.on { opacity: 1; pointer-events: auto; }
.fiche {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-height: 78dvh; overflow-y: auto;
  background: linear-gradient(180deg, #fffefa, #f7efdd); color: var(--encre); border-radius: 14px 14px 0 0;
  border-top: 2px solid var(--or); box-shadow: 0 -18px 40px rgba(0, 0, 0, .35);
  padding: 26px var(--gy) calc(env(safe-area-inset-bottom, 0px) + 26px) var(--gx);
  transform: translateY(105%); transition: transform .45s cubic-bezier(.2, .8, .2, 1);
  -webkit-user-select: text; user-select: text;
}
.fiche.on { transform: none; }
.fiche-in { max-width: 560px; margin: 0 auto; display: grid; gap: 10px; }
.fiche .inv { font-size: 12px; color: #8a7660; }
.fiche h2 { font-family: var(--display); font-style: italic; font-weight: 500; font-size: 30px; line-height: 1.1; margin: 0; text-wrap: balance; }
.fiche .m { font-size: 13.5px; color: #5d4f40; }
.fiche .corps { font-family: var(--display); font-size: 18.5px; line-height: 1.6; margin: 8px 0 6px; white-space: pre-line; }
.fiche .btn { justify-self: start; border-color: var(--or); color: var(--or-fonce); background: transparent; }

/* lettre */
#s-lettre {
  position: relative; z-index: 6; min-height: 100svh; display: flex; flex-direction: column; align-items: center;
  padding: 30vh var(--gy) calc(env(safe-area-inset-bottom, 0px) + 30px) var(--gx);
  background: linear-gradient(rgba(8, 6, 5, 0), rgba(8, 6, 5, .88) 32vh);
}
.lettre {
  width: min(100%, 520px); margin: 14px 0 26px; color: var(--encre); background: linear-gradient(165deg, #fffefa, #f7efdd);
  padding: 34px 28px 30px; border-radius: 2px; border: 1px solid rgba(199, 162, 90, .75);
  box-shadow: inset 0 0 0 7px #fffdf7, inset 0 0 0 8px rgba(199, 162, 90, .45), 0 30px 50px rgba(0, 0, 0, .5);
  background-image: radial-gradient(rgba(43, 36, 29, .05) 1px, transparent 1px), linear-gradient(165deg, #fffefa, #f7efdd);
  background-size: 4px 4px, auto;
  -webkit-user-select: text; user-select: text;
}
.lettre .entete-l { font-size: 12.5px; color: #8a7660; margin-bottom: 18px; }
.lettre h1 { font-family: var(--display); font-weight: 500; color: var(--or-fonce); font-size: clamp(32px, 9vw, 44px); line-height: 1.05; margin: 0 0 18px; text-wrap: balance; }
.lettre .corps { font-family: var(--display); font-size: 18px; line-height: 1.7; white-space: pre-line; }
.lettre .sign { font-family: var(--display); font-style: italic; font-size: 26px; color: var(--or-fonce); margin-top: 18px; text-align: right; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 20px; }

/* salle de cinéma */
#s-cinema {
  position: relative; z-index: 6; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; overflow: hidden;
  padding: calc(env(safe-area-inset-top, 0px) + 46px) var(--gy) calc(env(safe-area-inset-bottom, 0px) + 28px) var(--gx);
  background: radial-gradient(130% 55% at 50% 0%, #3b1016 0%, #170709 55%, #080404 100%);
}
.cine-titre { margin: 0; font-family: var(--display); font-weight: 500; font-size: clamp(30px, 8.6vw, 44px); line-height: 1.05; color: var(--ivoire); text-wrap: balance; text-shadow: 0 2px 18px rgba(0, 0, 0, .6); }
.cine-titre em { color: var(--or-clair); }
.cine-sous { margin: 0 0 8px; font-size: 13.5px; color: #e3d3b4; max-width: 34ch; text-shadow: 0 1px 8px rgba(0, 0, 0, .7); }
/* rideaux : se ferment en surimpression sur tout l'écran (par-dessus la lettre lue), le texte est posé dessus */
.rideaux { position: fixed; inset: 0; z-index: 3; visibility: visible; }
.rideaux::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 64px; z-index: 2;
  background: linear-gradient(#5e0f19, #3a0910); border-bottom: 3px solid #c9a35a; box-shadow: 0 6px 18px rgba(0, 0, 0, .55);
  transition: transform 1.6s cubic-bezier(.7, 0, .2, 1);
}
.rideau {
  position: absolute; top: 0; bottom: 0; width: 51%; transition: transform 2.6s cubic-bezier(.65, 0, .25, 1);
  background: radial-gradient(120% 40% at 50% 100%, rgba(0, 0, 0, .5), rgba(0, 0, 0, 0) 70%),
    repeating-linear-gradient(90deg, #4a0a13 0, #7e1825 22px, #9a2230 30px, #6a1220 40px, #4a0a13 52px);
}
.rideau.g { left: 0; box-shadow: inset -24px 0 30px rgba(0, 0, 0, .45); }
.rideau.d { right: 0; box-shadow: inset 24px 0 30px rgba(0, 0, 0, .45); }
.sur-rideau {
  position: absolute; inset: 64px 0 0; z-index: 1; display: flex; align-items: center; justify-content: center; padding: 24px var(--gx);
  background: radial-gradient(60% 45% at 50% 50%, rgba(18, 4, 6, .6), rgba(18, 4, 6, 0)); transition: opacity 1.2s ease 1.8s;
}
.cine-fin { display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 360px; }
.cine-fin .btn { width: 100%; }
.cine-fin .btn.plein { margin-top: 6px; }
.aide { margin: -4px 0 6px; font-size: 12px; line-height: 1.45; color: #d9c7a5; text-shadow: 0 1px 6px rgba(0, 0, 0, .8); }
.liens { margin: 4px 0 0; display: flex; gap: 10px; align-items: center; color: #d9c7a5; }
.lien { background: none; border: 0; padding: 6px 2px; font: inherit; font-size: 13px; color: var(--or-clair); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
#s-cinema.ouvert .rideau.g { transform: translateX(-100%); }
#s-cinema.ouvert .rideau.d { transform: translateX(100%); }
#s-cinema.ouvert .rideaux::before { transform: translateY(-100%); }
#s-cinema.ouvert .rideaux, #s-cinema.ouvert .sur-rideau { pointer-events: none; }
#s-cinema.ouvert .rideaux { visibility: hidden; transition: visibility 0s 2.7s; }
#s-cinema.ouvert .sur-rideau { opacity: 0; transition-delay: 0s; }
.credits { max-width: 46ch; margin: 10px 0 0; font-size: 11.5px; line-height: 1.5; color: #a8977a; }
#son {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); right: 14px; z-index: 8; width: 40px; height: 40px; padding: 0; border-radius: 50%;
  border: 1px solid rgba(236, 212, 155, .45); background: rgba(7, 8, 13, .35); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  display: grid; place-items: center;
}
#son .muet, #son.coupe .ondes { display: none; }
#son.coupe .muet { display: inline; }

/* film */
.film { position: fixed; inset: 0; z-index: 60; background: rgba(8, 6, 4, .96); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) var(--gy) calc(env(safe-area-inset-bottom, 0px) + 16px) var(--gx); }
.film canvas, .film video { height: min(62dvh, 560px); aspect-ratio: 9 / 16; max-width: 100%; background: #000; border-radius: 8px; box-shadow: 0 20px 40px rgba(0, 0, 0, .6); }
.barre { width: min(100%, 300px); height: 3px; background: rgba(255, 255, 255, .15); border-radius: 3px; overflow: hidden; }
.barre i { display: block; height: 100%; width: 0; background: var(--or-clair); }
.film .etat { font-size: 14px; text-align: center; max-width: 34ch; opacity: .85; margin: 0; }

.voile-noir { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .55s ease; z-index: 50; }
.voile-noir.on { opacity: 1; }
#charge {
  position: fixed; inset: 0; z-index: 70; background: var(--nuit); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  padding: 0 var(--gy) 0 var(--gx); text-align: center; transition: opacity 1.1s ease, visibility 0s linear 1.1s;
}
#charge.fin { opacity: 0; visibility: hidden; }
#charge p { margin: 0; font-family: var(--display); font-style: italic; font-size: 20px; color: var(--or-clair); max-width: 26ch; }
/* inauguration : le ruban du portique, à couper avant d'entrer */
#ruban {
  position: fixed; left: 0; right: 0; bottom: max(28px, env(safe-area-inset-bottom)); z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding: 0 16px; text-align: center; pointer-events: none; transition: opacity .8s ease;
}
#ruban.parti { opacity: 0; }
body.ruban #calques, body.ruban #suivant { opacity: 0; pointer-events: none; transition: opacity .5s; }
#ruban .sur { margin: 0; font: 500 12px/1 var(--texte); letter-spacing: .32em; text-transform: uppercase; color: var(--or-clair); text-shadow: 0 1px 8px rgba(0, 0, 0, .7); }

function hasard(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }

keys.forEach((K, i) => { if (i) acc += MOVE; K.a = acc; acc += K.hold; K.b = acc; });

// seuils musicaux : gospel en approchant la deuxième salle, Haendel juste avant l'annonce de la surprise
const S_GOSPEL = (keys.find((K) => K.k === "salle" && K.r === 1)?.a ?? T) - MOVE * .5, S_HAENDEL = kFinal.a - MOVE * .6;

function progres(s) {
  for (let i = 0; i <= DER; i++) {
    const K = keys[i];
    if (s <= K.b) {
      if (s >= K.a || i === 0) return { u: i, i, h: clamp((s - K.a) / K.hold) };
      return { u: i - 1 + lisse(clamp((s - keys[i - 1].b) / MOVE)), i: -1, h: 0 };
    }

// visite guidée : chaque trajet dure TRAJET secondes, chaque arrêt sa durée « film »
const TRAJET = 3.4;

  return s + dt;
}

}

// réduit la police jusqu'à ce que le texte espacé tienne dans « max »
function ajuste(x, txt, max, px, sp, pol) {
  for (; px > 10; px -= 2) { x.font = pol(px); const l = [...txt].reduce((a, c) => a + x.measureText(c).width, 0) + sp * ([...txt].length - 1); if (l <= max) break; }

const toile2d = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return [c, c.getContext("2d")]; };

    x.save(); x.translate(bx + sens * cw * (1 - pr), 0); x.fillStyle = velours; x.fillRect(0, 0, cw, H);
    const b = x.createRadialGradient(cw / 2, H, 0, cw / 2, H, cw * .8); b.addColorStop(0, "rgba(0, 0, 0, .5)"); b.addColorStop(1, "rgba(0, 0, 0, 0)");
    x.fillStyle = b; x.fillRect(0, H * .6, cw, H * .4);
    const e = sens < 0 ? x.createLinearGradient(cw, 0, cw - 54 * F, 0) : x.createLinearGradient(0, 0, 54 * F, 0);
    e.addColorStop(0, "rgba(0, 0, 0, .45)"); e.addColorStop(1, "rgba(0, 0, 0, 0)"); x.fillStyle = e; x.fillRect(0, 0, cw, H);

  const hv = 64 * F, yv = -hv * (1 - pv), gv = x.createLinearGradient(0, yv, 0, yv + hv); gv.addColorStop(0, "#5e0f19"); gv.addColorStop(1, "#3a0910");
  x.shadowColor = "rgba(0, 0, 0, .55)"; x.shadowBlur = 18 * F; x.shadowOffsetY = 6 * F;

}
// 3, 2, 1 en grand pendant que les rideaux s'ouvrent sur la nuit
function decompte2d(x, u) {

  const k = u % 1, a = k < .25 ? k / .25 : k > .75 ? (1 - k) / .25 : 1, sc = k < .25 ? 1.6 - .6 * k / .25 : k > .75 ? 1 - .15 * (k - .75) / .25 : 1;
  x.save(); x.globalAlpha = a; x.translate(W / 2, H / 2); x.scale(sc, sc);
  x.font = `500 ${Math.min(W * .34, 220 * F)}px ${POL.d}`; x.textAlign = "center"; x.textBaseline = "middle";
  x.shadowColor = "rgba(255, 196, 92, .55)"; x.shadowBlur = 40 * F; x.fillStyle = "#ecd49b"; x.fillText(String(3 - Math.floor(u)), 0, 0);
  x.restore();
}
function imageFilm(x, st, t) {
  const ph = st.ph;
  if (!NUIT_F.includes(ph)) {
    const s = ph === "lettre" || ph === "ferme" ? T : st.s;
    x.drawImage(moteur.image(s, t, kRubanF(st)), 0, 0, W, H);
    // pendant l'arrêt au ruban les cartes s'effacent, puis reviennent quand la visite reprend
    const m = ph === "ruban" ? 1 - clamp(st.u / .5) : ph === "lettre" ? 1 - clamp(st.u / 1.5) : ph === "ferme" ? 0 : st.coupe ? clamp(st.retour / .5) : 1;
    if (m > .01) keys.forEach((K, i) => { const a = opacite(K, i, s) * m; if (a > .01) carte2d(x, K, a, s); });
    if (ph === "ruban") ruban2d(x, st.u);
    if (ph === "lettre" || ph === "ferme") lettre2d(x, ph === "ferme" ? LETTRE : st.u); else cadre2d(x);
    if (ph === "ferme") rideaux2d(x, st.u);

  }
  x.drawImage(moteur.photo(), 0, 0, W, H);
  if (st.feu) { x.save(); x.globalAlpha = ph === "nuit" ? 1 : 1 - clamp(st.u / 1.2); x.drawImage(st.feu.cv, 0, 0, W, H); x.restore(); }
  if (ph === "nuit" && st.u < DECOMPTE) { if (st.u < 3) rideaux2d(x, 2.6 - (st.u - .3)); decompte2d(x, st.u - .3); }
  if (ph !== "nuit") rideaux2d(x, ph === "fin" ? 9 : st.u - 1.2);
  if (ph === "fin") finFilm(x, st.u);
}

/* ---------- Fin : rideaux et options ---------- */
$("#credits").textContent = C.musique?.credits || "";
// les rideaux se ferment quand on arrive, puis les options apparaissent
new IntersectionObserver(([e]) => {
  if (!$("#s-cinema").classList.contains("entracte")) $("#s-cinema").classList.toggle("ouvert", !e.isIntersecting);
}, { threshold: .55 }).observe($("#s-cinema"));
$("#aide-film").textContent = `Le film de ta visite se prépare en temps réel (environ ${enMinutes(DUREE_FILM)}), puis touche « Partager » et choisis WhatsApp, puis « Mon statut ».`;

/* ---------- Export vidéo (MP4 si possible, sinon WebM) ---------- */
let fichierFilm = null, annule = false;
let partageFilm = false;
async function filmer(partage) {
  partageFilm = !!partage;
  // créé tout de suite, dans le geste, sinon le navigateur le laisse muet
  let ac = null; try { ac = new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (_) {}
  const etatF = $("#film-etat"), barre = $("#film-barre"), cv = $("#film-canvas"), vid = $("#film-video");
  $("#film").hidden = false; cv.hidden = false; vid.hidden = true; $("#film-enregistrer").hidden = true; annule = false;
  const types = ["video/mp4;codecs=avc1.42E01E,mp4a.40.2", "video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];
  const mime = window.MediaRecorder && cv.captureStream && moteur ? types.find((m) => MediaRecorder.isTypeSupported(m)) : null;
  if (!mime) { ac?.close(); etatF.textContent = "Ce navigateur ne sait pas enregistrer de vidéo. Ouvre le musée dans Safari ou Chrome à jour."; return; }
  etatF.textContent = "Préparation du film…";
  await document.fonts.ready;

  const x = cv.getContext("2d"), flux = cv.captureStream(30);
  // bande son : mêmes musiques que la visite, enchaînées en fondu quand le film passe d'un poste à l'autre
  let son = null;
  if (ac) {
    try {
      const dest = ac.createMediaStreamDestination(), maitre = ac.createGain(); maitre.connect(dest);
      dest.stream.getAudioTracks().forEach((t) => flux.addTrack(t));
      const tampons = await Promise.all([C.musique?.visite, C.musique?.gospel, C.musique?.finale].map((u) => (u
        ? fetch(u).then((r) => r.arrayBuffer()).then((b) => new Promise((ok, ko) => ac.decodeAudioData(b, ok, ko))).catch(() => null) : null)));
      const NIV = [.85, .8, .9];
      son = { ac, maitre, i: -1, voix: null, bascule(i) {
        if (i === this.i) return; this.i = i;
        const t = ac.currentTime, v = this.voix;
        if (v) { v.g.gain.cancelScheduledValues(t); v.g.gain.setValueAtTime(v.g.gain.value, t); v.g.gain.linearRampToValueAtTime(0, t + 2.5); v.n.stop(t + 2.6); }
        this.voix = null; if (!tampons[i]) return;
        const n = ac.createBufferSource(), g = ac.createGain(); n.buffer = tampons[i]; n.loop = true;
        n.connect(g).connect(maitre); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(NIV[i], t + (v ? 2.5 : 1.5)); n.start(t);
        this.voix = { n, g };
      } };
    } catch (_) { son = null; }
  }
  let verrou = null; try { verrou = await navigator.wakeLock?.request("screen"); } catch (_) {}
  pistes.forEach((a) => fonduVol(a, 0, .5)); enCours = -1;
  enFilm = true; lenis?.stop(); moteur.preparer();

  const morceaux = [], rec = new MediaRecorder(flux, { mimeType: mime, videoBitsPerSecond: 6e6 });
  rec.ondataavailable = (e) => e.data.size && morceaux.push(e.data);
  const fini = new Promise((ok) => (rec.onstop = ok));
  rec.start(250); son?.bascule(0);
  etatF.textContent = `Enregistrement de la visite (${enMinutes(DUREE_FILM)}). Garde l'écran allumé jusqu'à la fin.`;
  const debut = performance.now();
  const st = nouveauFilm();
  let prec = debut, fondu = false;
  await new Promise((ok) => {
    (function image() {
      const now = performance.now(), dt = Math.min(.25, (now - prec) / 1000), t = (now - debut) / 1000; prec = now;
      avancerFilm(st, dt, t, son);
      if (st.ph === "fin" && !fondu && son) { fondu = true; const ta = ac.currentTime; son.maitre.gain.setValueAtTime(1, ta); son.maitre.gain.linearRampToValueAtTime(0, ta + FIN_FILM); }
      imageFilm(x, st, t);
      barre.style.width = `${clamp(t / DUREE_FILM) * 100}%`;
      if ((st.ph !== "fin" || st.u < FIN_FILM) && !annule) requestAnimationFrame(image); else ok();
    })();
  });
  rec.stop(); await fini;
  ac?.close();
  try { verrou?.release(); } catch (_) {}
  moteur.rendre(); enFilm = false; lenis?.start();
  if (annule) return;

  const type = mime.split(";")[0], ext = type === "video/mp4" ? "mp4" : "webm";
  const blob = new Blob(morceaux, { type });
  fichierFilm = new File([blob], `visite-madame-maman-${C.age}-ans.${ext}`, { type });
  vid.src = URL.createObjectURL(blob); vid.hidden = false; cv.hidden = true;
  // prêt : téléchargement ou partage lancés d'eux-mêmes, avec un bouton pour recommencer
  const bouton = $("#film-enregistrer"), duree = enMinutes(DUREE_FILM);
  bouton.hidden = false; bouton.classList.remove("pulse");
  bouton.textContent = partageFilm ? "Partager sur WhatsApp" : "Télécharger à nouveau";
  etatF.textContent = partageFilm ? `Ton film est prêt (${duree}). Choisis WhatsApp puis « Mon statut ».` : `Ton film est prêt (${duree}). Téléchargement en cours…`;
  const r = await enregistrer();
  if (r === "telecharge") { bouton.textContent = "Télécharger à nouveau"; etatF.textContent = `Ton film est téléchargé (${duree}) : retrouve-le dans tes Téléchargements, ou dans Fichiers sur iPhone.`; }
  else if (r === "refuse") { bouton.classList.add("pulse"); etatF.textContent = `Ton film est prêt (${duree}). Touche « Partager sur WhatsApp », choisis WhatsApp puis « Mon statut ».`; }
}
async function enregistrer() {
  if (!fichierFilm) return;
  if (partageFilm && navigator.canShare?.({ files: [fichierFilm] })) {
    try { await navigator.share({ files: [fichierFilm], title: C.nomMusee }); return "partage"; }
    catch (e) { return e.name === "AbortError" ? "annule" : "refuse"; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(fichierFilm); a.download = fichierFilm.name;
  document.body.append(a); a.click(); a.remove();

$("#faire-film").onclick = () => filmer(false);
$("#partager-film").onclick = () => filmer(true);
$("#film-enregistrer").onclick = () => { $("#film-enregistrer").classList.remove("pulse"); enregistrer(); };
$("#film-fermer").onclick = () => { annule = true; $("#film").hidden = true; $("#film-video").pause(); };
window.__film = {
  DUREE_FILM,
  // image du film à l'instant tf (s) et phase atteinte ; la simulation est rejouée depuis le début, sans son
  apercu(tf, pas = 1 / 15) {
    const [c, x] = toile2d(W, H), st = nouveauFilm(); moteur.preparer();
    for (let t = 0; t < tf && !(st.ph === "fin" && st.u >= FIN_FILM); t += pas) avancerFilm(st, pas, t, null);
    imageFilm(x, st, tf); moteur.rendre();
    return { ph: st.ph, u: +st.u.toFixed(2), s: +st.s.toFixed(2), img: c.toDataURL("image/jpeg", .75) };
  },
  // instants de début de chaque phase du film
  phases(pas = .1) {
    const st = nouveauFilm(), r = [["visite", 0]]; moteur.preparer();
    for (let t = 0; !(st.ph === "fin" && st.u >= FIN_FILM) && t < 900; t += pas) { const p = st.ph; avancerFilm(st, pas, t, null); if (st.ph !== p) r.push([st.ph, +t.toFixed(1)]); }
    moteur.rendre(); return r;
  }
};
